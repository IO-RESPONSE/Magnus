services:
  magnus:
    image: ${MAGNUS_IMAGE:-ioresponse/magnus:2.0.0}
    container_name: magnus-dev
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      # mode=1777 explicit: a bare --tmpfs mount defaults to owner
      # root, and magnusd runs as USER 65534 (Dockerfile) -- without
      # this it cannot create its control socket/audit-log/rollback
      # files under /tmp at all.
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3
